title: Conformer-averaged ABCG2 charges for flexible molecules
description: Average ABCG2 partial charges over the conformers of a flexible small molecule until the mean is statistically converged, with mono(2-hydroxyethyl) terephthalate (MHET) as the worked example, do the same for a ligand covalently bound to an active-site serine, and build the residues of a PET oligomer from capped fragments.
author: Alexandre V. Pinto
lang: en
image: /assets/img/social.jpg

# Shown at the top of the page. "hero" is the image next to the title: the
# accepted AM1 conformers of MHET overlaid, atoms coloured by the final charge
# (made with example/render_conformers.py).
topic: Force fields
topic_color: "#ff7d45"
tools: [AmberTools, RDKit, Python]
hero:
  src: /assets/img/mhet_conformers.webp
  width: 1400
  height: 989
  alt: The accepted conformers of MHET overlaid, with atoms coloured from red (negative) to blue (positive) by their final ABCG2 charge

# Pages of the tutorial, in reading order. They build the "Sections" menu and
# the Previous / Next links at the bottom of every page.
sections:
  - num: "1"
    title: Flexible molecule (MHET)
    url: /
  - num: "2"
    title: Covalently bound ligand
    url: /covalent_ligand.html
  - num: "3"
    title: Oligomer from fragments (PET)
    url: /oligomer_fragments.html

# The button next to the title starts with the first page.
primary_action:
  label: Start reading
  url: "#content"

# Main site (CompBioChem Tutorials) and this repository.
home_url: https://arvpinto.github.io/
repo_url: https://github.com/arvpinto/abcg2_charges_multi

# The page uses its own layout and stylesheet (no remote theme), matching the main site.
plugins:
  - jekyll-seo-tag
